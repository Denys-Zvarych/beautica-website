name: CI

on:
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # pull_request_target is allowed only in the hardened promotion-source.yml (guard pins its SHA-256).
      # The guard parses workflow YAML with PyYAML and fails closed without it.
      - name: Forbid privileged PR triggers outside the promotion guard
        run: |
          python3 -c 'import yaml' 2>/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml; }
          ./scripts/forbid_pull_request_target_outside_promotion.sh

      - name: Dependency audit (production deps, high+)
        run: npm audit --omit=dev --audit-level=high

      - run: npm run build

      # Release gate: legal pages must not carry TODO(owner) placeholders into main. Dev PRs stay green.
      - name: Release gate - no TODO(owner) placeholders (PRs into main only)
        if: github.base_ref == 'main'
        run: node scripts/check-no-todo-owner.mjs

      - name: Link check (offline, built HTML)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config lychee.toml --offline --no-progress --fallback-extensions html --root-dir ${{ github.workspace }}/dist/client 'dist/client/**/*.html'
          fail: true

      - name: HTML validation
        run: npx html-validate 'dist/client/**/*.html'

      # Cross-repo features land as same-named branches in the sibling repos: pin the ledger and the contract to that branch while it
      # exists, else dev. The head ref goes through env (never interpolated into the script).
      - name: Resolve sibling refs (same-named feature branch, else dev)
        id: refs
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          for r in backend mobile; do
            ref=dev
            if [ -n "$HEAD_REF" ] && git ls-remote --exit-code --heads "https://github.com/Denys-Zvarych/beautica-$r" "refs/heads/$HEAD_REF" >/dev/null 2>&1; then ref="$HEAD_REF"; fi
            echo "$r=$ref" >> "$GITHUB_OUTPUT"
          done

      # Token parity needs the app theme. The mobile repo is public until release; if the checkout
      # fails (repo made private, no token) the step below is skipped and the owner is warned.
      - name: Checkout mobile theme (token source)
        id: mobile
        continue-on-error: true
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Denys-Zvarych/beautica-mobile
          ref: ${{ steps.refs.outputs.mobile }}
          path: beautica-mobile
          sparse-checkout: |
            lib/core/theme
            lib/features/booking/presentation

      - name: Token parity (CSS vs Dart)
        if: steps.mobile.outcome == 'success'
        run: node scripts/check-tokens.mjs --mobile beautica-mobile

      - name: Token parity skipped
        if: steps.mobile.outcome != 'success'
        run: echo "::warning::beautica-mobile not checkable (private?). Token parity NOT verified in CI; run node scripts/check-tokens.mjs locally."

      # Factual copy ledger (docs/claims.md): every claim row points at a source line and a built anchor.
      - name: Claims ledger
        run: npm run check:claims

      # Layout at 320/360/768/1280: no horizontal scroll, tap targets >= 48 px. Needs a Chromium: the runner's Chrome.
      - name: Responsive check (all pages)
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: node scripts/check-responsive.mjs --routes /,/404,/privacy,/terms,/support,/delete-account,/l/invite,/l/booking,/l/review,/l/cancel

      # Build-output checks that need no server: CSP-safe markup, size budgets, _headers == securityHeaders.ts, rewrites.
      - name: Static build checks (CSP-safe markup, budgets, header parity)
        timeout-minutes: 5
        run: npm run test:static

      # Site <-> backend contract (phases 008/009): the mock backend, the parsers and every request body are compared with the backend's
      # Java records, and the numbers the pages state (2 h cancel, 60 days, 10 services) with the backend constants. The backend repo is
      # public until release; its ref is the PR's same-named branch when it exists, else dev (repo variable BACKEND_CONTRACT_REF overrides).
      # No server, no browser: ~1 s. When the checkout fails the backend-dependent specs skip and a warning is printed.
      - name: Checkout backend sources (contract source)
        id: backend
        continue-on-error: true
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Denys-Zvarych/beautica-backend
          ref: ${{ vars.BACKEND_CONTRACT_REF || steps.refs.outputs.backend }}
          path: beautica-backend
          sparse-checkout: |
            src/main/java/com/beautica
            src/main/resources

      - name: Contract - site vs backend DTOs, claim numbers, policy version, CI wiring
        if: steps.backend.outcome == 'success'
        timeout-minutes: 5
        run: npm run test:contract
        env:
          REQUIRE_BACKEND: "1"
          BACKEND_DIR: beautica-backend
          MOBILE_DIR: beautica-mobile
          REQUIRE_MOBILE: ${{ steps.mobile.outcome == 'success' && '1' || '0' }}

      - name: Contract - backend sources unavailable (policy version and CI wiring only)
        if: steps.backend.outcome != 'success'
        timeout-minutes: 5
        run: |
          echo "::warning::beautica-backend not checkable (private?). DTO contract and claim-number pins NOT verified in CI; run npm run test:contract locally."
          npm run test:contract

  # Flows + endpoint contract + headers/SEO against `wrangler dev` on the built site (scripts/run-tests.mjs starts and stops it), plus the CLS probes.
  # Runs in parallel with `site`, `lighthouse` and `e2e_booking` (the slow browser specs, below): each job stays far from its 20-minute cap
  # (the single job that held everything was cancelled at its old 12-minute cap).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build

      # The booking specs are slow (real browser flows, axe): each runs as its own command so every step stays well under 5 minutes.
      - name: Tests (flows, /api/delete-request contract, headers + SEO, link-page SSR; without the slow booking specs)
        timeout-minutes: 5
        run: npm test
        env:
          TEST_EXCLUDE: booking-flow.test,book-axe,booking-privacy,book-salon-wizard,review-page,book-blocked

      - name: Tests - guest booking flow (browser, mock backend)
        timeout-minutes: 5
        run: node scripts/run-tests.mjs tests/booking-flow.test.mjs

      # Phase 020 blocked-phone banner (browser, mock backend): its own step; the default step sat at 4m55s of its 5 minutes.
      - name: Tests - blocked-phone banner (browser, mock backend)
        timeout-minutes: 5
        run: node scripts/run-tests.mjs tests/book-blocked.test.mjs

      # Where the Turnstile token, phone, SMS code, guest token and name may go (per request, storage, analytics funnel). ~30 s.
      - name: Tests - guest booking privacy (data flow + analytics funnel)
        timeout-minutes: 5
        run: node scripts/run-tests.mjs tests/booking-privacy.test.mjs

      # Phase 022 success-screen reminder choice (browser, mock backend); also the CLS probe of the done step (<= 0.005).
      - name: Tests - booking success screen reminders + done-step CLS
        timeout-minutes: 5
        run: node scripts/run-tests.mjs tests/book-reminders.test.mjs

      # Cold-cache layout shift. Lighthouse profile (412 px, lost font preload => reflow) on four representative routes; the late-font
      # stress profile (360/320 px, fonts delayed) on the home page, the four legal pages and the token shell.
      - name: CLS probe - Lighthouse-like profile
        timeout-minutes: 5
        run: node scripts/measure-cls.mjs --profiles lighthouse --runs 1 --routes /,/privacy,/delete-account,/l/cancel
      - name: CLS probe - late-font stress profile
        timeout-minutes: 5
        run: node scripts/measure-cls.mjs --profiles stress --runs 1 --routes /,/privacy,/terms,/support,/delete-account,/l/cancel

  # The slow browser specs of the booking pages (salon wizard, axe sweeps) and Lighthouse on the SSR link pages, against `wrangler dev` + the mock
  # backend. A job of its own so the two e2e jobs run side by side (both are required checks).
  e2e_booking:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build

      # The salon wizard (services -> masters -> time per master -> OTP once -> a booking per master) and the services-tab filter: ~2 min on a quiet runner.
      - name: Tests - salon booking wizard (browser, mock backend)
        timeout-minutes: 5
        run: node scripts/run-tests.mjs tests/book-salon-wizard.test.mjs

      # Phase 019 guest review page /r/{token}: SSR headers + the island in a real browser (~494 lines of flows), a step of its own so the e2e job's
      # default step stays under 5 minutes.
      - name: Tests - guest review page (browser, mock backend)
        timeout-minutes: 5
        run: node scripts/run-tests.mjs tests/review-page.test.mjs

      - name: Tests - axe sweep of the link pages (360 px)
        timeout-minutes: 5
        run: node scripts/run-tests.mjs tests/book-axe.test.mjs
        env:
          AXE_WIDTHS: "360"

      - name: Tests - axe sweep of the link pages (768 and 1280 px)
        timeout-minutes: 5
        run: node scripts/run-tests.mjs tests/book-axe.test.mjs
        env:
          AXE_WIDTHS: "768,1280"

      # Lighthouse (mobile) on the SSR link pages against wrangler dev + the mock backend: master, 12-photo rail, salon, sorted view, guest review form /r/; 3 runs each.
      # Budgets (median of the runs): Perf >= 90, LCP < 2400 ms (target 2000, warns above it), TBT < 50 ms, CLS < 0.02, JS <= 20 KB.
      # Two steps (LH_PAGES splits the list of scripts/lighthouse-ssr.mjs) so each stays within 5 minutes: 3 pages x 3 runs, then 2 pages x 3 runs.
      - name: Lighthouse - SSR link pages (master, salon, review form)
        timeout-minutes: 5
        run: |
          # Deterministic browser: the runner's Chrome (google-chrome, else chromium); fail loudly when there is none.
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_PATH" || { echo "no Chrome on the runner"; exit 1; }
          export CHROME_PATH
          "$CHROME_PATH" --version
          LH_PAGES='["/book/oksana-ab12","/book/s/lavanda-1111","/r/rvmulti-lhci-00000001"]' node scripts/lighthouse-ssr.mjs --runs 3

      - name: Lighthouse - SSR link pages (photo rail, sorted view)
        timeout-minutes: 5
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_PATH" || { echo "no Chrome on the runner"; exit 1; }
          export CHROME_PATH
          LH_PAGES='["/book/rail-8888","/book/oksana-ab12?sort=OLDEST"]' node scripts/lighthouse-ssr.mjs --runs 3

  # Lighthouse over every page (3 runs, median): perf >= 95, a11y 100, SEO 100 (0.66 on the noindex pages, where only
  # is-crawlable fails by design), CLS/LCP/TBT, and resource budgets. Own job: ~4 min of Chrome runs stay off the critical path.
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build

      # Measured 5.5 min on a green run (10 pages x 3 runs); the 5-minute step rule is for the test commands only.
      - name: Lighthouse budget (mobile; every page)
        timeout-minutes: 12
        run: npx --no-install lhci autorun
