name: Gitleaks

# ──────────────────────────────────────────────────────────────────────────
# SECRET SCAN. This repo is PRIVATE, so GitHub's free secret scanning and push
# protection do NOT apply: this workflow is the only secret scan here.
#
# It guards the Worker secrets that must never reach git: `.dev.vars`,
# BOOKING_INFO_WORKER_KEY, any service token or API key. Runs on every PR and
# push to dev/main, plus a weekly FULL-HISTORY sweep. Any finding fails the job.
#
# Cost / licensing:
#   - Free for personal-account repos (Denys-Zvarych/*). GITLEAKS_LICENSE is
#     ONLY required for repos owned by a GitHub *organization*; if this repo
#     moves under an org, get a free key at https://gitleaks.io and add it as
#     the `GITLEAKS_LICENSE` repo secret.
#   - Uses no paid GitHub Advanced Security features.
#
# To make this BLOCK merges: GitHub -> Settings -> Branches -> branch
# protection for `dev` and `main` -> "Require status checks to pass" -> add
# the "Scan for secrets" check.
# ──────────────────────────────────────────────────────────────────────────

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  schedule:
    # Weekly full-history sweep, Mondays 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write   # lets gitleaks-action post a summary comment on PRs

jobs:
  gitleaks:
    name: Scan for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          # fetch-depth: 0 pulls the ENTIRE history so the scheduled deep scan
          # and the PR/push diff range both have every commit available.
          fetch-depth: 0
          # No authenticated git after checkout (scan is local-only).
          persist-credentials: false

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.x — keep updated via Dependabot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pinned: the action's default (8.24.3) predates the [[allowlists]] syntax
          # used in .gitleaks.toml (needs >= 8.25), so it would ignore the allowlist.
          GITLEAKS_VERSION: "8.30.1"
          # Org-owned repos only — leave unset for personal accounts:
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
